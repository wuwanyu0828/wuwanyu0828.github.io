<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATRI 的小站 ✦ 个人主页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1e90e8; --brand-2:#35c6e0; --brand-soft:rgba(30,144,232,.10);
    --ink:#18191c; --ink-2:#4a4d55; --muted:#8b9099;
    --page:rgba(255,255,255,.90);
    --panel:rgba(255,255,255,.72);
    --panel-brd:rgba(24,25,28,.07);
    --scrim:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.06) 46%,transparent);
    --shadow:0 1px 2px rgba(24,25,28,.04), 0 8px 24px rgba(24,25,28,.07);
    --shadow-hi:0 2px 6px rgba(24,25,28,.06), 0 16px 36px rgba(24,25,28,.13);
    --radius:10px; --radius-sm:8px;
    --veil:linear-gradient(180deg,rgba(247,249,252,.62),rgba(238,245,251,.86) 42%,rgba(240,246,252,.94));
  }
  [data-theme="dark"]{
    --brand:#4bb4ff; --brand-2:#4fd8e8; --brand-soft:rgba(75,180,255,.14);
    --ink:#e9ecf1; --ink-2:#c3c8d1; --muted:#8d939e;
    --page:rgba(22,24,29,.92);
    --panel:rgba(35,38,45,.72);
    --panel-brd:rgba(255,255,255,.09);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.34);
    --shadow-hi:0 2px 8px rgba(0,0,0,.4), 0 16px 36px rgba(0,0,0,.45);
    --veil:linear-gradient(180deg,rgba(12,16,24,.82),rgba(9,12,19,.93));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;color:var(--ink);line-height:1.6;min-height:100vh;overflow-x:hidden;
    background-color:#cfe6f8;
    background-image:var(--veil),url('c922469b42fc459a26f6d155a0ef1cb96498967a45143cb9e0230a23c3e7d101.png');
    background-size:cover,cover;
    background-position:center,center;
    background-repeat:no-repeat,no-repeat;
    background-attachment:fixed,fixed;
    -webkit-font-smoothing:antialiased;
    transition:color .25s;
  }
  a{color:inherit;text-decoration:none}
  img{display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* ============ 顶部导航 ============ */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:color-mix(in srgb,var(--page) 88%,transparent);
    backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--panel-brd);
  }
  .bar{display:flex;align-items:center;gap:18px;height:58px}
  .logo{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .logo .mark{color:var(--brand);font-size:17px}
  .menu{display:flex;gap:20px;flex:1}
  .menu a{color:var(--ink-2);font-size:14px;transition:color .16s}
  .menu a:hover{color:var(--brand)}
  .search{
    display:flex;align-items:center;gap:8px;width:280px;
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius-sm);
    padding:0 12px;height:36px;transition:border-color .16s,background .16s;
  }
  .search:focus-within{border-color:var(--brand);background:var(--page)}
  .search .si{font-size:13px;opacity:.55}
  .search input{
    flex:1;border:0;outline:0;background:transparent;color:var(--ink);
    font-size:13px;font-family:inherit;min-width:0;
  }
  .search input::placeholder{color:var(--muted)}
  .acts{display:flex;align-items:center;gap:10px}
  .icon-btn{
    width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;
    border:1px solid var(--panel-brd);background:var(--panel);color:var(--ink);transition:.16s;
  }
  .icon-btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn-up{
    height:36px;padding:0 18px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;
    font-size:13px;font-weight:500;color:#fff;background:var(--brand);transition:.16s;white-space:nowrap;
  }
  .btn-up:hover{background:color-mix(in srgb,var(--brand) 86%,#000)}

  /* ============ Banner ============ */
  .banner{padding:64px 0 34px;position:relative;z-index:1}
  .banner-inner{
    display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap;
  }
  .kicker{
    display:inline-block;font-size:12px;font-weight:500;letter-spacing:.6px;
    color:var(--brand);background:var(--brand-soft);padding:4px 11px;border-radius:99px;margin-bottom:14px;
    backdrop-filter:blur(6px);
  }
  .banner h1{
    font-size:clamp(28px,4.6vw,42px);font-weight:700;line-height:1.22;letter-spacing:-.6px;
    color:#fff;text-shadow:0 2px 10px rgba(12,40,70,.45), 0 1px 2px rgba(12,40,70,.5);
  }
  .banner h1 .nm{color:#dff2ff;text-shadow:0 0 22px rgba(120,200,255,.75),0 2px 10px rgba(12,40,70,.5)}
  .banner p{
    color:#12324f;font-weight:500;font-size:15px;max-width:560px;margin-top:10px;
    text-shadow:0 1px 6px rgba(255,255,255,.85);
  }
  [data-theme="dark"] .banner p{color:#cfe2f5;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .bstats{display:flex;gap:12px}
  .bstats .s{
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);
    padding:10px 18px;text-align:center;backdrop-filter:blur(10px);box-shadow:var(--shadow);min-width:82px;
  }
  .bstats b{display:block;font-size:20px;font-weight:700;color:var(--brand);line-height:1.2}
  .bstats span{font-size:12px;color:var(--muted)}

  /* ============ 主内容面板 ============ */
  .page{
    position:relative;z-index:1;margin-bottom:34px;
    background:var(--page);border:1px solid var(--panel-brd);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 1px 3px rgba(24,25,28,.05), 0 22px 50px rgba(24,25,28,.12);
    overflow:hidden;
  }
  [data-theme="dark"] .page{box-shadow:0 1px 3px rgba(0,0,0,.4), 0 22px 50px rgba(0,0,0,.5)}

  /* 分类胶囊 */
  .cats{
    display:flex;gap:8px;overflow-x:auto;padding:16px 22px;
    border-bottom:1px solid var(--panel-brd);scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    padding:7px 15px;border-radius:var(--radius-sm);font-size:13px;color:var(--ink-2);
    background:var(--panel);border:1px solid transparent;transition:.16s;
  }
  .cat:hover{color:var(--brand);background:var(--brand-soft)}
  .cat.on{background:var(--brand);color:#fff;font-weight:500}
  .cat.on:hover{color:#fff}

  section{padding:30px 22px 6px}
  section + section{border-top:1px solid var(--panel-brd)}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:18px}
  .sec-head h2{font-size:19px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
  .sec-head h2::before{content:"";width:3px;height:17px;border-radius:2px;background:var(--brand)}
  .sec-head .sub{font-size:13px;color:var(--muted)}

  /* ============ 卡片网格 ============ */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:24px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px 18px;padding-bottom:24px}

  .cover{
    position:relative;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;
    background:#dfe7f0;display:block;
  }
  .cover img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
  .cover::after{
    content:"";position:absolute;inset:0;background:var(--scrim);
    opacity:.9;transition:opacity .25s;pointer-events:none;
  }
  .cover .scrim-txt{
    position:absolute;left:10px;right:10px;bottom:8px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .cover .scrim-txt .l{display:flex;align-items:center;gap:5px;min-width:0}
  .cover .scrim-txt .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cover .tagpill{
    flex:none;font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;
    background:rgba(0,0,0,.62);backdrop-filter:blur(4px);text-shadow:none;
  }

  /* 视频卡 */
  .vcard .cover:hover img{transform:scale(1.045)}
  .vcard .ttl{
    font-size:14px;font-weight:500;line-height:1.45;margin-top:10px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:40px;transition:color .16s;
  }
  .vcard:hover .ttl{color:var(--brand)}
  .vrow{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--muted)}
  .av{
    width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  .vrow .sep{opacity:.5}

  /* 项目卡 */
  .pcard{
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);
    overflow:hidden;transition:transform .22s,box-shadow .22s;
  }
  .pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
  .pcover{
    position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(135deg,#1e90e8,#35c6e0 60%,#7fe0ea);
  }
  .pcover::before{
    content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .pcover .big{font-size:52px;position:relative;filter:drop-shadow(0 4px 12px rgba(0,0,0,.28));transition:transform .3s}
  .pcard:hover .pcover .big{transform:scale(1.08) rotate(-3deg)}
  .pcover .corner{
    position:absolute;top:9px;left:9px;z-index:2;font-size:11px;font-weight:500;color:#fff;
    padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);
  }
  .pbody{padding:15px 16px 16px}
  .pbody h3{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .pbody p{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.65}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{
    font-size:11px;padding:3px 9px;border-radius:4px;
    color:var(--brand);background:var(--brand-soft);font-weight:500;
  }
  .pgo{
    display:inline-flex;align-items:center;gap:5px;margin-top:13px;
    font-size:13px;font-weight:500;color:var(--brand);transition:gap .18s;
  }
  .pcard:hover .pgo{gap:9px}

  /* 社交链接 */
  .socials{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 26px}
  .socials a{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);
    border:1px solid var(--panel-brd);background:var(--panel);font-size:13px;font-weight:500;
    color:var(--ink-2);transition:.16s;
  }
  .socials a:hover{color:#fff;background:var(--brand);border-color:var(--brand);transform:translateY(-2px)}

  /* 空状态 */
  .empty{padding:40px 0 48px;text-align:center;color:var(--muted);font-size:13px;display:none}
  .empty.on{display:block}

  footer{
    border-top:1px solid var(--panel-brd);padding:22px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);
  }
  footer .fnav{display:flex;gap:16px}
  footer .fnav a:hover{color:var(--brand)}

  @media(max-width:820px){
    .menu{display:none}
    .search{width:auto;flex:1;min-width:0}
    .bar{gap:12px}
  }
  @media(max-width:520px){
    .banner{padding:44px 0 26px}
    .banner-inner{align-items:flex-start}
    .btn-up{display:none}
    section{padding:26px 16px 4px}
    .cats{padding:13px 16px}
    .pgrid,.vgrid{grid-template-columns:1fr;gap:18px}
    footer{padding:18px 16px}
  }
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="wrap bar">
    <a class="logo" href="#top"><span class="mark">✦</span><span id="navName">ATRI 的小站</span></a>
    <nav class="menu">
      <a href="#projects">项目</a>
      <a href="#videos">视频</a>
      <a href="#links">链接</a>
    </nav>
    <div class="search">
      <span class="si">🔍</span>
      <input id="q" type="search" placeholder="搜索项目 / 视频…" autocomplete="off" />
    </div>
    <div class="acts">
      <button class="icon-btn" id="themeToggle" title="切换昼 / 夜">🌙</button>
      <a class="btn-up" id="upBtn" href="#videos">看视频</a>
    </div>
  </div>
</header>

<!-- ============ Banner ============ -->
<section class="banner" id="top">
  <div class="wrap banner-inner">
    <div>
      <span class="kicker">PERSONAL PAGE</span>
      <h1>你好，我是 <span class="nm" id="heroName">ATRI</span></h1>
      <p id="heroTagline">这里收着我做的小项目和我录的游戏实况。</p>
    </div>
    <div class="bstats">
      <div class="s"><b id="statProj">0</b><span>个项目</span></div>
      <div class="s"><b id="statVid">0</b><span>个视频</span></div>
    </div>
  </div>
</section>

<!-- ============ 主面板 ============ -->
<div class="wrap">
  <div class="page">

    <nav class="cats">
      <a class="cat on" href="#top">🏠 首页</a>
      <a class="cat" href="#projects">🎮 项目</a>
      <a class="cat" href="#videos">📺 视频</a>
      <a class="cat" href="#links">🔗 链接</a>
    </nav>

    <section id="projects">
      <div class="sec-head">
        <h2>做过的项目</h2>
        <span class="sub">点封面进入体验</span>
      </div>
      <div class="pgrid" id="projectGrid"></div>
    </section>

    <section id="videos">
      <div class="sec-head">
        <h2>录过的视频</h2>
        <span class="sub">点击封面在 YouTube 观看</span>
      </div>
      <div class="vgrid" id="videoGrid"></div>
    </section>

    <section id="links">
      <div class="sec-head">
        <h2>在下面找到我</h2>
        <span class="sub">其他平台</span>
      </div>
      <div class="socials" id="socialList"></div>
    </section>

    <div class="empty" id="empty">没有匹配的内容，换个关键词试试～</div>

    <footer>
      <span>© <span id="year"></span> ATRI · 用 GitHub Pages 搭建</span>
      <span class="fnav">
        <a href="#projects">项目</a>
        <a href="#videos">视频</a>
        <a href="#top">回到顶部 ↑</a>
      </span>
    </footer>

  </div>
</div>

<script>
/* ============================================================
   只改下面这一块就能维护整个网站
   ============================================================ */
const profile = {
  name: "ATRI",
  tagline: "这里收着我做的小项目和我录的游戏实况。",
  socials: [
    { icon: "🐙", label: "GitHub",   url: "https://github.com/wuwanyu0828" },
    { icon: "▶",  label: "YouTube",  url: "https://www.youtube.com/" },
    { icon: "📺", label: "Bilibili", url: "https://space.bilibili.com/" }
  ]
};

// 项目：emoji 封面图标 / corner 封面左上角小标签 / title / desc / tags / link / linkLabel
const projects = [
  {
    emoji: "🔍",
    corner: "互动视觉小说",
    title: "无人生还 · 游戏化改编",
    desc: "把阿加莎·克里斯蒂的经典悬疑《无人生还》改编成可互动的视觉小说，让没读过原著的人也能沉浸走进这场孤岛谜案。",
    tags: ["悬疑推理", "互动游戏", "小说改编"],
    link: "https://4be7e32d959748799e9b6bac1eb7826d.bj2.agentos-app.net",
    linkLabel: "开始游玩"
  },
  {
    emoji: "🐢",
    corner: "推理问答",
    title: "海龟汤题库 · 情景推理",
    desc: "一个海龟汤（情境推理）在线题库，用一个个短谜题考验你的联想力与推理能力，看看你能猜中几个。",
    tags: ["推理问答", "题库", "网页应用"],
    link: "https://turtle-soup-qa.app.workbuddy.host/",
    linkLabel: "开始推理"
  }
  // 复制上面这一段 { ... } 就能继续加项目
];

// 视频：title / youtube 填视频ID或完整链接 / note 封面底部小字 / badge 封面右下角角标 / kind 作者行后缀
const videos = [
  {
    title: "恶校游戏 · 实况录屏",
    youtube: "https://www.youtube.com/watch?v=sa1bMgWF78M&list=PLUz-_q-Bc874",
    note: "恶校游戏 通关实况",
    badge: "YouTube",
    kind: "游戏实况"
  },
  {
    title: "与美女合租的99种死法 · 实况录屏",
    youtube: "https://www.youtube.com/watch?v=SI5ZHFjVElo&list=PLMmlNZapsSb0",
    note: "与美女合租的99种死法 录屏",
    badge: "YouTube",
    kind: "游戏实况"
  }
  // 复制上面这一段 { ... } 就能继续加视频
];
/* ============================================================
   以下内容一般不用动
   ============================================================ */

function ytId(input){
  if(!input) return "";
  input = input.trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  const m = input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : input;
}

document.getElementById("navName").textContent = profile.name + " 的小站";
document.getElementById("heroName").textContent = profile.name;
document.getElementById("heroTagline").textContent = profile.tagline;
document.getElementById("year").textContent = new Date().getFullYear();
document.getElementById("statProj").textContent = projects.length;
document.getElementById("statVid").textContent = videos.length;

document.getElementById("projectGrid").innerHTML = projects.map(p => `
  <article class="pcard" data-title="${p.title}">
    <a class="pcover" href="${p.link||"#"}" target="_blank" rel="noopener" title="${p.title}">
      ${p.corner ? `<span class="corner">${p.corner}</span>` : ""}
      <span class="big">${p.emoji||"✨"}</span>
    </a>
    <div class="pbody">
      <h3>${p.title}</h3>
      <p>${p.desc||""}</p>
      <div class="chips">${(p.tags||[]).map(t=>`<span class="chip">${t}</span>`).join("")}</div>
      <a class="pgo" href="${p.link||"#"}" target="_blank" rel="noopener">${p.linkLabel||"去看看"} ›</a>
    </div>
  </article>
`).join("");

document.getElementById("videoGrid").innerHTML = videos.map(v => {
  const id = ytId(v.youtube);
  const img = id ? `https://i.ytimg.com/vi/${id}/hqdefault.jpg` : "";
  const href = id ? `https://www.youtube.com/watch?v=${id}` : (v.youtube||"#");
  return `
  <article class="vcard" data-title="${v.title}">
    <a class="cover" href="${href}" target="_blank" rel="noopener" title="${v.title}">
      ${img ? `<img src="${img}" alt="${v.title}" loading="lazy">` : ""}
      <span class="scrim-txt">
        <span class="l">▷<span>${v.note||""}</span></span>
        ${v.badge ? `<span class="tagpill">${v.badge}</span>` : ""}
      </span>
    </a>
    <h3 class="ttl">${v.title}</h3>
    <div class="vrow">
      <span class="av">A</span>
      <span>${profile.name}</span>
      <span class="sep">·</span>
      <span>${v.kind||"视频"}</span>
    </div>
  </article>`;
}).join("");

document.getElementById("socialList").innerHTML = profile.socials.map(s => `
  <a href="${s.url}" target="_blank" rel="noopener"><span>${s.icon||"🔗"}</span>${s.label}</a>
`).join("");

// 搜索：按标题实时过滤项目 / 视频
const q = document.getElementById("q");
const empty = document.getElementById("empty");
const items = Array.from(document.querySelectorAll("[data-title]"));
q.addEventListener("input", () => {
  const kw = q.value.trim().toLowerCase();
  let hit = 0;
  items.forEach(el => {
    const ok = !kw || (el.dataset.title||"").toLowerCase().includes(kw);
    el.style.display = ok ? "" : "none";
    if(ok) hit++;
  });
  empty.classList.toggle("on", hit === 0);
});

// 昼 / 夜切换
const toggle = document.getElementById("themeToggle");
if(localStorage.getItem("theme") === "dark"){
  document.documentElement.setAttribute("data-theme","dark");
  toggle.textContent = "☀️";
}
toggle.addEventListener("click", () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  if(dark){ document.documentElement.removeAttribute("data-theme"); toggle.textContent="🌙"; localStorage.setItem("theme","light"); }
  else { document.documentElement.setAttribute("data-theme","dark"); toggle.textContent="☀️"; localStorage.setItem("theme","dark"); }
});
</script>
</body>
