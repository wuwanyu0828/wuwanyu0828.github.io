<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATRI 的小站 ✦ 个人主页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1e90e8; --brand-2:#35c6e0; --brand-soft:rgba(30,144,232,.10);
    --ink:#18191c; --ink-2:#4a4d55; --muted:#8b9099;
    --page:rgba(255,255,255,.90);
    --panel:rgba(255,255,255,.72);
    --panel-brd:rgba(24,25,28,.07);
    --scrim:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,.06) 46%,transparent);
    --shadow:0 1px 2px rgba(24,25,28,.04), 0 8px 24px rgba(24,25,28,.07);
    --shadow-hi:0 2px 6px rgba(24,25,28,.06), 0 16px 36px rgba(24,25,28,.13);
    --radius:10px; --radius-sm:8px;
    --veil:linear-gradient(180deg,rgba(247,249,252,.62),rgba(238,245,251,.86) 42%,rgba(240,246,252,.94));
  }
  [data-theme="dark"]{
    --brand:#4bb4ff; --brand-2:#4fd8e8; --brand-soft:rgba(75,180,255,.14);
    --ink:#e9ecf1; --ink-2:#c3c8d1; --muted:#8d939e;
    --page:rgba(22,24,29,.92);
    --panel:rgba(35,38,45,.72);
    --panel-brd:rgba(255,255,255,.09);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.34);
    --shadow-hi:0 2px 8px rgba(0,0,0,.4), 0 16px 36px rgba(0,0,0,.45);
    --veil:linear-gradient(180deg,rgba(12,16,24,.82),rgba(9,12,19,.93));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;color:var(--ink);line-height:1.6;min-height:100vh;overflow-x:hidden;
    background-color:#cfe6f8;
    background-image:var(--veil),url('c922469b42fc459a26f6d155a0ef1cb96498967a45143cb9e0230a23c3e7d101.png');
    background-size:cover,cover;
    background-position:center center,44% center;
    background-repeat:no-repeat,no-repeat;
    background-attachment:fixed,fixed;
    -webkit-font-smoothing:antialiased;
    transition:color .25s;
  }
  a{color:inherit;text-decoration:none}
  img{display:block}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  /* ============ 顶部导航 ============ */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:color-mix(in srgb,var(--page) 88%,transparent);
    backdrop-filter:saturate(180%) blur(16px);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--panel-brd);
  }
  .bar{display:flex;align-items:center;gap:18px;height:58px}
  .logo{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .logo .mark{color:var(--brand);font-size:17px}
  .search{
    display:flex;align-items:center;gap:8px;flex:1;max-width:420px;margin:0 auto;
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius-sm);
    padding:0 12px;height:36px;transition:border-color .16s,background .16s;
  }
  .search:focus-within{border-color:var(--brand);background:var(--page)}
  .search .si{font-size:13px;opacity:.55}
  .search input{
    flex:1;border:0;outline:0;background:transparent;color:var(--ink);
    font-size:13px;font-family:inherit;min-width:0;
  }
  .search input::placeholder{color:var(--muted)}
  .acts{display:flex;align-items:center;gap:10px}
  .icon-btn{
    width:36px;height:36px;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;
    border:1px solid var(--panel-brd);background:var(--panel);color:var(--ink);transition:.16s;
  }
  .icon-btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn-up{
    height:36px;padding:0 18px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;
    font-size:13px;font-weight:500;color:#fff;background:var(--brand);transition:.16s;white-space:nowrap;
  }
  .btn-up:hover{background:color-mix(in srgb,var(--brand) 86%,#000)}

  /* ============ Banner ============ */
  .banner{padding:104px 0 108px;position:relative;z-index:1}
  .banner-inner{
    display:flex;align-items:flex-end;justify-content:space-between;gap:30px;flex-wrap:wrap;
  }
  .kicker{
    display:inline-block;font-size:12px;font-weight:500;letter-spacing:.6px;
    color:var(--brand);background:var(--brand-soft);padding:4px 11px;border-radius:99px;margin-bottom:14px;
    backdrop-filter:blur(6px);
  }
  .banner h1{
    font-size:clamp(28px,4.6vw,42px);font-weight:700;line-height:1.22;letter-spacing:-.6px;
    color:#fff;text-shadow:0 2px 10px rgba(12,40,70,.45), 0 1px 2px rgba(12,40,70,.5);
  }
  .banner h1 .nm{color:#dff2ff;text-shadow:0 0 22px rgba(120,200,255,.75),0 2px 10px rgba(12,40,70,.5)}
  .banner p{
    color:#12324f;font-weight:500;font-size:15px;max-width:560px;margin-top:10px;
    text-shadow:0 1px 6px rgba(255,255,255,.85);
  }
  [data-theme="dark"] .banner p{color:#cfe2f5;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .bstats{display:flex;gap:12px}
  .bstats .s{
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);
    padding:10px 18px;text-align:center;backdrop-filter:blur(10px);box-shadow:var(--shadow);min-width:82px;
  }
  .bstats b{display:block;font-size:20px;font-weight:700;color:var(--brand);line-height:1.2}
  .bstats span{font-size:12px;color:var(--muted)}

  /* ============ 主内容面板 ============ */
  .page{
    position:relative;z-index:1;margin-bottom:34px;
    background:var(--page);border:1px solid var(--panel-brd);border-radius:14px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 1px 3px rgba(24,25,28,.05), 0 22px 50px rgba(24,25,28,.12);
    overflow:hidden;
  }
  [data-theme="dark"] .page{box-shadow:0 1px 3px rgba(0,0,0,.4), 0 22px 50px rgba(0,0,0,.5)}

  /* 分类胶囊 */
  .cats{
    display:flex;gap:8px;overflow-x:auto;padding:16px 22px;
    border-bottom:1px solid var(--panel-brd);scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    padding:7px 15px;border-radius:var(--radius-sm);font-size:13px;color:var(--ink-2);
    background:var(--panel);border:1px solid transparent;transition:.16s;
  }
  .cat:hover{color:var(--brand);background:var(--brand-soft)}
  .cat.on{background:var(--brand);color:#fff;font-weight:500}
  .cat.on:hover{color:#fff}

  section{padding:30px 22px 6px}
  section + section{border-top:1px solid var(--panel-brd)}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:18px}
  .sec-head h2{font-size:19px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
  .sec-head h2::before{content:"";width:3px;height:17px;border-radius:2px;background:var(--brand)}
  .sec-head .sub{font-size:13px;color:var(--muted)}

  /* ============ 卡片网格 ============ */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding-bottom:24px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:20px 18px;padding-bottom:24px}

  .cover{
    position:relative;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;
    background:#dfe7f0;display:block;
  }
  .cover img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
  .cover::after{
    content:"";position:absolute;inset:0;background:var(--scrim);
    opacity:.9;transition:opacity .25s;pointer-events:none;
  }
  .cover .scrim-txt{
    position:absolute;left:10px;right:10px;bottom:8px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .cover .scrim-txt .l{display:flex;align-items:center;gap:5px;min-width:0}
  .cover .scrim-txt .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cover .tagpill{
    flex:none;font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;
    background:rgba(0,0,0,.62);backdrop-filter:blur(4px);text-shadow:none;
  }

  /* 视频卡 */
  .vcard .cover:hover img{transform:scale(1.045)}
  .vcard .ttl{
    font-size:14px;font-weight:500;line-height:1.45;margin-top:10px;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    min-height:40px;transition:color .16s;
  }
  .vcard:hover .ttl{color:var(--brand)}
  .vrow{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:12px;color:var(--muted)}
  .av{
    width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  .vrow .sep{opacity:.5}

  /* 项目卡 */
  .pcard{
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);
    overflow:hidden;transition:transform .22s,box-shadow .22s;
  }
  .pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
  .pcover{
    position:relative;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(135deg,#1e90e8,#35c6e0 60%,#7fe0ea);
  }
  .pcover::before{
    content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px);
    background-size:26px 26px;
  }
  .pcover .big{font-size:52px;position:relative;filter:drop-shadow(0 4px 12px rgba(0,0,0,.28));transition:transform .3s}
  .pcard:hover .pcover .big{transform:scale(1.08) rotate(-3deg)}
  .pcover .corner{
    position:absolute;top:9px;left:9px;z-index:2;font-size:11px;font-weight:500;color:#fff;
    padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);
  }
  .pbody{padding:15px 16px 16px}
  .pbody h3{font-size:16px;font-weight:700;letter-spacing:-.2px}
  .pbody p{font-size:13px;color:var(--ink-2);margin-top:7px;line-height:1.65}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{
    font-size:11px;padding:3px 9px;border-radius:4px;
    color:var(--brand);background:var(--brand-soft);font-weight:500;
  }
  .pgo{
    display:inline-flex;align-items:center;gap:5px;margin-top:13px;
    font-size:13px;font-weight:500;color:var(--brand);transition:gap .18s;
  }
  .pcard:hover .pgo{gap:9px}

  /* 社交链接 */
  .socials{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 26px}
  .socials a{
    display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);
    border:1px solid var(--panel-brd);background:var(--panel);font-size:13px;font-weight:500;
    color:var(--ink-2);transition:.16s;
  }
  .socials a:hover{color:#fff;background:var(--brand);border-color:var(--brand);transform:translateY(-2px)}

  /* 空状态 */
  .empty{padding:40px 0 48px;text-align:center;color:var(--muted);font-size:13px;display:none}
  .empty.on{display:block}

  footer{
    border-top:1px solid var(--panel-brd);padding:22px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    font-size:12px;color:var(--muted);
  }
  footer .fnav{display:flex;gap:16px}
  footer .fnav a:hover{color:var(--brand)}

  @media(max-width:820px){
    .search{max-width:none;min-width:0}
    .bar{gap:12px}
  }
  @media(max-width:520px){
    .banner{padding:64px 0 40px}
    .banner-inner{align-items:flex-start}
    .btn-up{display:none}
    section{padding:26px 16px 4px}
    .cats{padding:13px 16px}
    .pgrid,.vgrid{grid-template-columns:1fr;gap:18px}
    footer{padding:18px 16px}
  }

  /* ============ 桌宠（会散步的互动宠物） ============ */
  /* 探针：用于让 JS 读到 env(safe-area-inset-bottom)（刘海屏手势条 / iOS home 指示条） */
  #sabProbe{position:fixed;left:-9999px;top:0;width:1px;
    height:env(safe-area-inset-bottom,0px);pointer-events:none}
  .pet{position:fixed;right:16px;bottom:0;width:196px;z-index:55;
    user-select:none;-webkit-user-select:none;touch-action:none;will-change:left}
  .pet-inner{position:relative;cursor:grab;transform:scaleX(1);transition:transform .18s ease}
  .pet.dragging .pet-inner{cursor:grabbing}
  .pet img{width:100%;height:auto;display:block;pointer-events:none;
    filter:drop-shadow(0 5px 10px rgba(16,44,80,.45))}
  .pet.idle img{animation:petBob 4.2s ease-in-out infinite}
  .pet.walking img{animation:petWalkBob .52s ease-in-out infinite}
  .pet.dragging img{animation:none}
  @keyframes petBob{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-6px) rotate(1deg)}
  }
  @keyframes petWalkBob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3px)}
  }
  @keyframes petBounce{
    0%,100%{transform:translateY(0)}
    30%{transform:translateY(-22px)}
    60%{transform:translateY(-8px)}
  }
  .pet.bounce .pet-inner > img{animation:petBounce .6s ease}
  .pet .bubble{
    position:absolute;bottom:calc(100% + 2px);left:50%;
    transform:translateX(-50%) translateY(5px) scale(.94);transform-origin:bottom center;
    background:#fff;color:#1b1d22;font-size:12px;line-height:1.5;font-weight:500;
    padding:7px 12px;border-radius:12px;white-space:nowrap;
    box-shadow:0 8px 22px rgba(16,44,80,.22);opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;
  }
  .pet .bubble.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  .pet .bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;
    border:5px solid transparent;border-top-color:#fff}
  [data-theme="dark"] .pet .bubble{background:#22262e;color:#e9ecf1}
  [data-theme="dark"] .pet .bubble::after{border-top-color:#22262e}
  .heart{position:fixed;z-index:56;pointer-events:none;color:#ff5b8d;
    animation:heartFloat 1.1s ease-out forwards;will-change:transform,opacity}
  @keyframes heartFloat{
    0%{transform:translateY(0) scale(.5);opacity:0}
    20%{opacity:1}
    100%{transform:translateY(-64px) scale(1.25);opacity:0}
  }
  /* 手机端：很多手机浏览器 / App 内置浏览器的底部工具条会盖住视口底部，
     桌宠若贴死 bottom:0 就只剩头顶露出来 → 先整体抬起，JS 再按视觉视口与安全区精调 */
  @media(max-width:700px){
    .pet{right:8px;bottom:64px}
  }
  @media(max-width:640px){
    .pet{width:150px;right:8px}
    .pet .bubble{font-size:11px;padding:6px 10px}
  }
  @media(max-width:430px){
    .pet{width:112px;right:6px}
    .pet .bubble{font-size:10px;padding:5px 9px}
  }
  @media(prefers-reduced-motion:reduce){
    .pet img{animation:none}
  }
</style>
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <div class="wrap bar">
    <a class="logo" href="#top"><span class="mark">✦</span><span id="navName">ATRI 的小站</span></a>
    <div class="search">
      <span class="si">🔍</span>
      <input id="q" type="search" placeholder="搜索项目 / 视频…" autocomplete="off" />
    </div>
    <div class="acts">
      <button class="icon-btn" id="themeToggle" title="切换昼 / 夜">🌙</button>
      <a class="btn-up" id="upBtn" href="#videos">看视频</a>
    </div>
  </div>
</header>

<!-- ============ Banner ============ -->
<section class="banner" id="top">
  <div class="wrap banner-inner">
    <div>
      <span class="kicker">PERSONAL PAGE</span>
      <h1>你好，我是 <span class="nm" id="heroName">ATRI</span></h1>
      <p id="heroTagline">这里收着我做的小项目和我录的游戏实况。</p>
    </div>
    <div class="bstats">
      <div class="s"><b id="statProj">0</b><span>个项目</span></div>
      <div class="s"><b id="statVid">0</b><span>个视频</span></div>
    </div>
  </div>
</section>

<!-- ============ 主面板 ============ -->
<div class="wrap">
  <div class="page">

    <nav class="cats">
      <a class="cat on" href="#top">🏠 首页</a>
      <a class="cat" href="#projects">🎮 项目</a>
      <a class="cat" href="#videos">📺 视频</a>
      <a class="cat" href="#links">🔗 链接</a>
    </nav>

    <section id="projects">
      <div class="sec-head">
        <h2>做过的项目</h2>
        <span class="sub">点封面进入体验</span>
      </div>
      <div class="pgrid" id="projectGrid"></div>
    </section>

    <section id="videos">
      <div class="sec-head">
        <h2>录过的视频</h2>
        <span class="sub">点击封面在 YouTube 观看</span>
      </div>
      <div class="vgrid" id="videoGrid"></div>
    </section>

    <section id="links">
      <div class="sec-head">
        <h2>在下面找到我</h2>
        <span class="sub">其他平台</span>
      </div>
      <div class="socials" id="socialList"></div>
    </section>

    <div class="empty" id="empty">没有匹配的内容，换个关键词试试～</div>

    <footer>
      <span>© <span id="year"></span> ATRI · 用 GitHub Pages 搭建</span>
      <span class="fnav">
        <a href="#projects">项目</a>
        <a href="#videos">视频</a>
        <a href="#top">回到顶部 ↑</a>
      </span>
    </footer>

  </div>
</div>

<!-- 探针：让 JS 读到底部安全区高度（不显示） -->
<div id="sabProbe" aria-hidden="true"></div>

<!-- ============ 桌宠 ============ -->
<div class="pet" id="pet" title="我是ATRI～点我摸摸，按住能拖动，我还会自己散步哦">
  <div class="bubble" id="petBubble">你好呀～</div>
  <div class="pet-inner"><img id="petImg" src="pet-idle.png" alt="ATRI 桌宠" draggable="false"></div>
</div>

<script>
/* ============================================================
   只改下面这一块就能维护整个网站
   ============================================================ */
const profile = {
  name: "ATRI",
  tagline: "这里收着我做的小项目和我录的游戏实况。",
  socials: [
    { icon: "🐙", label: "GitHub",   url: "https://github.com/wuwanyu0828" },
    { icon: "▶",  label: "YouTube",  url: "https://www.youtube.com/" },
    { icon: "📺", label: "Bilibili", url: "https://space.bilibili.com/" }
  ]
};

// 项目：emoji 封面图标 / corner 封面左上角小标签 / title / desc / tags / link / linkLabel
const projects = [
  {
    emoji: "🔍",
    corner: "互动视觉小说",
    title: "无人生还 · 游戏化改编",
    desc: "把阿加莎·克里斯蒂的经典悬疑《无人生还》改编成可互动的视觉小说，让没读过原著的人也能沉浸走进这场孤岛谜案。",
    tags: ["悬疑推理", "互动游戏", "小说改编"],
    link: "https://4be7e32d959748799e9b6bac1eb7826d.bj2.agentos-app.net",
    linkLabel: "开始游玩"
  },
  {
    emoji: "🐢",
    corner: "推理问答",
    title: "海龟汤题库 · 情景推理",
    desc: "一个海龟汤（情境推理）在线题库，用一个个短谜题考验你的联想力与推理能力，看看你能猜中几个。",
    tags: ["推理问答", "题库", "网页应用"],
    link: "https://turtle-soup-qa.app.workbuddy.host/",
    linkLabel: "开始推理"
  }
  // 复制上面这一段 { ... } 就能继续加项目
];

function ytId(input){
  if(!input) return "";
  input = input.trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
  const m = input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : input;
}

/* ---------- 桌宠：全身 Q 版 ATRI · 会散步 · 会走 · 摸它开心 ---------- */
(function(){
  const pet = document.getElementById("pet");
  if(!pet) return;
  const img = document.getElementById("petImg");
  const bubble = document.getElementById("petBubble");
  const inner = pet.querySelector(".pet-inner");

  // 素材：全身 Q 版 ATRI —— 由图像生成 + 抠图 + 归一化得到（角色高/脚底基线已对齐）
  const IDLE = "pet-idle.png", HAPPY = "pet-happy.png";
  const WALK = ["pet-walk-1.png","pet-walk-2.png","pet-walk-3.png","pet-walk-4.png"];
  const FRAME_MS = 130;   // 每帧停留时长，越小迈步越快

  // ATRI 性格：高性能仿生机器人少女，感情丰富 / 好奇心旺盛 / 乐观天真 / 有点笨拙 / 常走神回忆丢失的记忆
  const LINES = {
    yes:  ["我是高性能的嘛！主人的小站我也在学着打理～",
           "今天也来看我啦，主人♪",
           "上面那些项目都是主人做的哦，要不要看看？",
           "我虽然家务不太行…但陪主人聊天是高性能的！",
           "好吃就是高兴嘛！…啊，我刚在想螃蟹的事",
           "主人的事，我都会好好记着的♪"],
    // 走神 / 回忆：原作里她因沉睡海底丢失了部分记忆，常常发呆回想
    no:   ["……（好像想起了一点什么，又模糊了）",
           "海底沉睡的那段，记不太清了呢…",
           "在发呆想想主人说过的话～",
           "唔…我的记忆库，偶尔会卡一下"],
    walk: ["去那边散散步～海边空气真好♪",
           "走走走走～我可是高性能的腿脚哦！",
           "去逛逛主人的小站角落！"],
    pet:  ["谢谢你摸我，主人♥",
           "好开心～最喜欢主人了♥",
           "……（满足地哼起了小曲）♪"]
  };
  const pick = a => a[Math.floor(Math.random()*a.length)];

  // 预加载所有帧，切换时不闪白
  [IDLE, HAPPY].concat(WALK).forEach(s => { const i = new Image(); i.src = s; });

  let state = "idle", dir = 0, targetX = null, dragging = false;
  let x = null, start = null, hideTimer = null, nextWander = 0;
  let frameIdx = 0, frameClock = 0;
  let bottomMode = true;   // true=贴底站立（bottom 定位）；false=被拖到别处（top 定位）
  let liftPx = 0;          // 从视口底部抬起多少，避开浏览器 / App 底部工具条与安全区

  function setImg(s){ if(img.getAttribute("src") !== s) img.setAttribute("src", s); }
  function setDir(d){ if(dir === d) return; dir = d; inner.style.transform = "scaleX(" + d + ")"; }
  function say(text){
    bubble.textContent = text; bubble.classList.add("on");
    clearTimeout(hideTimer); hideTimer = setTimeout(() => bubble.classList.remove("on"), 3400);
  }
  function petW(){ return pet.offsetWidth || 196; }
  function clampX(v){ const w = petW(); return Math.min(Math.max(v, 8), window.innerWidth - w - 8); }
  function place(){
    bottomMode = true;
    pet.style.right = "auto"; pet.style.top = "auto";
    pet.style.bottom = liftPx + "px"; pet.style.left = x + "px";
  }

  /* 算出桌宠该从视口底部抬起多少像素。
     手机上「贴死底部」会被浏览器 / App 内置浏览器的底部工具条挡住 —— 只露出头顶。 */
  function computeLift(){
    let lift = 0;
    // 1) 安全区：刘海屏手势条 / iOS home 指示条
    const probe = document.getElementById("sabProbe");
    if(probe) lift = Math.max(lift, Math.round(probe.getBoundingClientRect().height));
    // 2) 工具条 / 地址栏的遮挡：视觉视口比布局视口矮掉的那部分
    const vv = window.visualViewport;
    if(vv && vv.height){
      lift = Math.max(lift, Math.round(window.innerHeight - (vv.offsetTop + vv.height)));
    }
    // 3) 手机 + 国内 App 内置浏览器：底部工具条常常不计入布局视口 → 保守再抬一截
    if(window.innerWidth <= 700){
      const ua = navigator.userAgent || "";
      const inApp = /DingTalk|MicroMessenger|QQ\/|QQBrowser|UCBrowser|Weibo|Alipay|Baidu|HuaweiBrowser|MiuiBrowser|VivoBrowser|HeytapBrowser/i.test(ua);
      lift = Math.max(lift, inApp ? 76 : 0);
    }
    // 上限：最多抬到视口高度的 45%，免得把宠物顶到屏幕中间
    return Math.min(lift, Math.round(window.innerHeight * 0.45));
  }
  function applyLift(){
    const before = liftPx;
    liftPx = computeLift();
    if(liftPx !== before && bottomMode && !dragging) place();
  }
  function setState(s){
    state = s;
    pet.classList.toggle("idle", s === "idle");
    pet.classList.toggle("walking", s === "walking");
  }

  function enterIdle(now){
    targetX = null; setState("idle"); setImg(IDLE);
    nextWander = now + 4000 + Math.random()*5000;
  }

  function pickWander(now){
    const w = petW();
    let t = 8 + Math.random() * (window.innerWidth - w - 16);
    if(Math.abs(t - x) < 80) t = clampX(x + (Math.random() < .5 ? -1 : 1) * (180 + Math.random()*220));
    targetX = clampX(t);
    setState("walking"); setImg(WALK[0]); frameIdx = 0; frameClock = now;
    if(Math.random() < .5) say(pick(LINES.walk));
  }

  function tick(now){
    if(dragging){ requestAnimationFrame(tick); return; }
    if(state === "walking" && targetX != null){
      const step = 1.9;
      if(Math.abs(targetX - x) <= step){
        x = targetX; place(); enterIdle(now);
      } else {
        setDir(targetX > x ? 1 : -1); x += dir * step; place();
        if(now - frameClock >= FRAME_MS){            // 循环切换走路分解帧
          frameClock = now; frameIdx = (frameIdx + 1) % WALK.length; setImg(WALK[frameIdx]);
        }
      }
    } else if(state === "idle"){
      if(now > nextWander){
        if(Math.random() < .7) pickWander(now);
        else { nextWander = now + 9000; say(pick(LINES.no)); }   // 走神发呆
      }
    }
    requestAnimationFrame(tick);
  }

  function hearts(){
    const r = pet.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height*0.22;
    for(let i=0;i<4;i++){
      const h = document.createElement("div"); h.className = "heart"; h.textContent = "♥";
      h.style.left = (cx + (Math.random()*44 - 22)) + "px";
      h.style.top  = (cy + (Math.random()*20 - 10)) + "px";
      h.style.fontSize = (14 + Math.random()*10) + "px";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }
  }

  pet.addEventListener("pointerdown", e => {
    if(e.target.closest(".bubble")) return;
    dragging = true; targetX = null; setState("dragging");
    const r = pet.getBoundingClientRect();
    start = { px:e.clientX, py:e.clientY, left:r.left, top:r.top, moved:false };
    pet.classList.add("dragging");
    try{ pet.setPointerCapture(e.pointerId); }catch(_){}
  });
  pet.addEventListener("pointermove", e => {
    if(!start) return;
    const dx = e.clientX - start.px, dy = e.clientY - start.py;
    if(!start.moved && Math.hypot(dx, dy) < 6) return;
    start.moved = true;
    const w = pet.offsetWidth, h = pet.offsetHeight;
    const L = Math.min(Math.max(start.left + dx, 6), window.innerWidth - w - 6);
    const T = Math.min(Math.max(start.top + dy, 6), window.innerHeight - liftPx - h + 46);
    bottomMode = false;
    pet.style.bottom = "auto"; pet.style.right = "auto";
    pet.style.left = L + "px"; pet.style.top = T + "px";
  });
  function beHappy(){
    setState("happy");                              // 关掉 idle / walking 动画
    setImg(HAPPY); hearts(); say(pick(LINES.pet));
    pet.classList.add("bounce");
    setTimeout(() => pet.classList.remove("bounce"), 640);
    setTimeout(() => { if(state === "happy") enterIdle(performance.now()); }, 1300);
  }

  function endDrag(){
    if(!start) return;
    const wasDrag = start.moved; start = null; dragging = false; pet.classList.remove("dragging");
    if(wasDrag){
      x = clampX(pet.getBoundingClientRect().left);
      place();
      try{ localStorage.setItem("petX", String(x)); }catch(_){}
      enterIdle(performance.now());
    } else {
      beHappy();                                    // 单击＝摸摸它
    }
  }
  pet.addEventListener("pointerup", endDrag);
  pet.addEventListener("pointercancel", endDrag);

  pet.addEventListener("pointerenter", () => {
    if(start || dragging) return;
    if(Math.random() < .5) say(pick(state === "idle" ? LINES.yes : LINES.walk));
  });

  function relayout(){
    applyLift();
    if(!dragging){ x = clampX(x); place(); }
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", () => setTimeout(relayout, 150));
  if(window.visualViewport) window.visualViewport.addEventListener("resize", applyLift);
  window.addEventListener("beforeunload", () => { try{ localStorage.setItem("petX", String(x)); }catch(_){} });

  // 初始位置：优先用上次保存的横向位置
  let savedX = null;
  try{ const v = localStorage.getItem("petX"); if(v) savedX = clampX(parseFloat(v)); }catch(_){}
  x = savedX != null ? savedX : clampX(window.innerWidth - petW() - 16);
  liftPx = computeLift();
  setDir(-1); setState("idle"); setImg(IDLE); place();
  nextWander = performance.now() + 4000 + Math.random()*4000;

  requestAnimationFrame(tick);
  setTimeout(() => say("你好呀，我是高性能机器人 ATRI～主人把这小站交给我看着啦！"), 1100);
})();
</script>
