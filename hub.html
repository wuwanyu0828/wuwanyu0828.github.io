<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二次元导航 · ATRI 的小站</title>
<meta name="description" content="番剧 / Coser / 游戏 / 同人 一站式聚合导航，精选二次元平台与社区直达。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌐</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1e90e8; --brand-2:#35c6e0; --brand-soft:rgba(30,144,232,.10);
    --ink:#18191c; --ink-2:#4a4d55; --muted:#8b9099;
    --page:rgba(255,255,255,.90);
    --panel:rgba(255,255,255,.72);
    --panel-brd:rgba(24,25,28,.07);
    --shadow:0 1px 2px rgba(24,25,28,.04), 0 8px 24px rgba(24,25,28,.07);
    --shadow-hi:0 2px 6px rgba(24,25,28,.06), 0 16px 36px rgba(24,25,28,.13);
    --radius:10px; --radius-sm:8px;
    --veil:linear-gradient(180deg,rgba(247,249,252,.62),rgba(238,245,251,.86) 42%,rgba(240,246,252,.94));
  }
  [data-theme="dark"]{
    --brand:#4bb4ff; --brand-2:#4fd8e8; --brand-soft:rgba(75,180,255,.14);
    --ink:#e9ecf1; --ink-2:#c3c8d1; --muted:#8d939e;
    --page:rgba(22,24,29,.92);
    --panel:rgba(35,38,45,.72);
    --panel-brd:rgba(255,255,255,.09);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.34);
    --shadow-hi:0 2px 8px rgba(0,0,0,.4), 0 16px 36px rgba(0,0,0,.45);
    --veil:linear-gradient(180deg,rgba(12,16,24,.82),rgba(9,12,19,.93));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;color:var(--ink);line-height:1.6;min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(30,144,232,.16), transparent 60%),
      radial-gradient(900px 480px at 92% 4%, rgba(53,198,224,.16), transparent 58%),
      var(--veil);
    background-attachment:fixed;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}

  /* 顶栏 */
  .topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    background:var(--panel);border-bottom:1px solid var(--panel-brd);box-shadow:var(--shadow)}
  .topbar .row{display:flex;align-items:center;gap:12px;height:58px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
  .brand .mark{color:var(--brand);font-size:18px}
  .brand .sub{font-size:11px;color:var(--muted);font-weight:500}
  .search{flex:1;display:flex;align-items:center;gap:8px;max-width:520px;margin:0 auto;
    border:1px solid var(--panel-brd);background:var(--page);border-radius:var(--radius-sm);padding:0 12px;height:38px}
  .search:focus-within{border-color:var(--brand)}
  .search svg{flex:none;color:var(--muted)}
  .search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;min-width:0}
  .search input::placeholder{color:var(--muted)}
  .icon-btn{width:38px;height:38px;border-radius:var(--radius-sm);cursor:pointer;font-size:16px;flex:none;
    border:1px solid var(--panel-brd);background:var(--panel);color:var(--ink);transition:.16s;display:grid;place-items:center}
  .icon-btn:hover{border-color:var(--brand);color:var(--brand)}
  .home-link{font-size:13px;color:var(--ink-2);border:1px solid var(--panel-brd);padding:0 13px;height:38px;border-radius:var(--radius-sm);
    display:inline-flex;align-items:center;gap:6px;transition:.16s}
  .home-link:hover{border-color:var(--brand);color:var(--brand)}

  /* Hero */
  .hero{text-align:center;padding:42px 0 22px}
  .hero h1{font-size:27px;font-weight:700;letter-spacing:.5px}
  .hero h1 .em{background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin-top:9px;color:var(--ink-2);font-size:14px}
  .stats{display:flex;justify-content:center;gap:26px;margin-top:18px;flex-wrap:wrap}
  .stats .s b{font-size:20px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
  .stats .s span{font-size:12px;color:var(--muted);margin-left:5px}

  /* 控制条 */
  .controls{position:sticky;top:58px;z-index:40;padding:10px 0;background:transparent}
  .cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
  .cats::-webkit-scrollbar{display:none}
  .cat{flex:none;padding:7px 15px;border-radius:var(--radius-sm);font-size:13px;color:var(--ink-2);
    background:var(--panel);border:1px solid transparent;transition:.16s;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
  .cat:hover{color:var(--brand);background:var(--brand-soft)}
  .cat.on{background:var(--brand);color:#fff;font-weight:500;box-shadow:var(--shadow-hi)}
  .subrow{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
  .tags{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
  .tags::-webkit-scrollbar{display:none}
  .tag{flex:none;font-size:12px;padding:5px 11px;border-radius:99px;cursor:pointer;transition:.15s;
    border:1px solid var(--panel-brd);background:var(--panel);color:var(--ink-2)}
  .tag:hover{border-color:var(--brand);color:var(--brand)}
  .tag.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:600}
  .sort{display:flex;gap:6px;flex:none}
  .sort button{font-size:12px;padding:5px 11px;border-radius:99px;cursor:pointer;border:1px solid var(--panel-brd);
    background:var(--panel);color:var(--ink-2);transition:.15s;font-family:inherit}
  .sort button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  /* 板块 */
  .board{margin:14px 0 8px}
  .sec{background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 16px 8px;margin-bottom:16px;backdrop-filter:blur(6px)}
  .sec-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--panel-brd);margin-bottom:6px}
  .sec-head .ico{font-size:20px}
  .sec-head h2{font-size:16px;font-weight:700}
  .sec-head .desc{font-size:12px;color:var(--muted);margin-left:2px}
  .sec-head .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
  .list{list-style:none}
  .item{display:flex;align-items:center;gap:13px;padding:11px 8px;border-radius:var(--radius-sm);transition:.14s;
    border-bottom:1px solid var(--panel-brd)}
  .item:last-child{border-bottom:0}
  .item:hover{background:var(--brand-soft)}
  .rank{flex:none;width:26px;text-align:center;font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .item:nth-child(1) .rank,.item.top .rank{color:var(--brand)}
  .item-body{flex:1;min-width:0}
  .item-title{font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
  .item:hover .item-title{color:var(--brand)}
  .hot{font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff6a88,#ff9966);padding:1px 6px;border-radius:99px;flex:none}
  .item-desc{font-size:12.5px;color:var(--ink-2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .itag{font-size:10.5px;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:99px}
  .item-meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .plat{font-size:11px;color:var(--muted);border:1px solid var(--panel-brd);padding:2px 9px;border-radius:99px;white-space:nowrap}
  .go{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--brand);
    border:1px solid var(--panel-brd);background:var(--page);transition:.16s;font-size:14px}
  .item:hover .go{border-color:var(--brand);background:var(--brand);color:#fff}

  .empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px;display:none}
  .empty.show{display:block}
  .empty .big{font-size:34px;margin-bottom:10px}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 0 60px;line-height:1.8}
  footer a{color:var(--brand)}

  .totop{position:fixed;right:20px;bottom:22px;width:42px;height:42px;border-radius:50%;border:1px solid var(--panel-brd);
    background:var(--panel);color:var(--brand);font-size:18px;cursor:pointer;box-shadow:var(--shadow-hi);opacity:0;
    pointer-events:none;transition:.2s;z-index:55;display:grid;place-items:center}
  .totop.show{opacity:1;pointer-events:auto}
  .totop:hover{border-color:var(--brand);transform:translateY(-2px)}

  /* 全网热榜（纯文字标题，参考 open2hub） */
  .hotsec{margin:18px 0 6px}
  .trend-note{font-size:12px;color:var(--muted);margin:2px 0 13px;line-height:1.6}
  .trend-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  .trend-col{background:var(--panel);border:1px solid var(--panel-brd);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 14px 7px;backdrop-filter:blur(6px)}
  .trend-col h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px;padding-bottom:9px;border-bottom:1px solid var(--panel-brd);margin-bottom:4px}
  .trend-col h3 .ph{font-size:12px;color:var(--muted);margin-left:auto;font-weight:500}
  .trend-list{list-style:none}
  .trend-item{display:flex;align-items:flex-start;gap:9px;padding:8px 4px;border-bottom:1px dashed var(--panel-brd);transition:.14s}
  .trend-item:last-child{border-bottom:0}
  .trend-item:hover{background:var(--brand-soft)}
  .trend-no{flex:none;width:18px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.45}
  .trend-item:nth-child(1) .trend-no{color:#ff6a88}
  .trend-item:nth-child(2) .trend-no{color:#ff9966}
  .trend-item:nth-child(3) .trend-no{color:var(--brand)}
  .trend-item a{flex:1;font-size:13.5px;color:var(--ink-2);line-height:1.45;transition:.14s}
  .trend-item:hover a{color:var(--brand)}

  @media(max-width:640px){
    .wrap{padding:0 12px}
    .hero{padding:30px 0 16px}
    .hero h1{font-size:22px}
    .brand .sub{display:none}
    .brand{white-space:normal;font-size:13px;min-width:0}
    .home-link span{display:none}
    .search{margin:0;min-width:0}
    .search input{font-size:13px}
    .item-desc{white-space:normal}
    .topbar .row{height:54px;gap:8px;padding:0 10px}
    .sec-head .desc{display:none}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="wrap row">
      <a class="brand" href="index.html"><span class="mark">◈</span><span>ATRI 的小站<span class="sub"> / 二次元导航</span></span></a>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="搜站点 / 标签 / 简介…" autocomplete="off">
      </label>
      <a class="home-link" href="index.html">🏠<span>回主页</span></a>
      <button class="icon-btn" id="themeToggle" title="切换昼 / 夜" aria-label="切换主题">🌙</button>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <h1>二次元<span class="em">聚合导航</span></h1>
      <p>番剧 · Coser · 游戏 · 同人 — 精选平台一站直达</p>
      <div class="stats">
        <div class="s"><b id="statItems">0</b><span>个站点</span></div>
        <div class="s"><b id="statCats">0</b><span>个分类</span></div>
        <div class="s"><b id="statUpdated">—</b><span>更新于</span></div>
      </div>
    </section>

    <section class="hotsec">
      <div class="sec-head">
        <span class="ico">🔥</span><h2>国内热榜 · 快照</h2><span class="desc">参考 open2hub 聚合形式</span>
      </div>
      <p class="trend-note" id="trendNoteDomestic"></p>
      <div class="trend-grid" id="hotGridDomestic"></div>
    </section>

    <section class="hotsec">
      <div class="sec-head">
        <span class="ico">🌏</span><h2>国外热榜 · 快照</h2><span class="desc">MAL / AniList 实时榜单</span>
      </div>
      <p class="trend-note" id="trendNoteOverseas"></p>
      <div class="trend-grid" id="hotGridOverseas"></div>
    </section>

    <div class="controls">
      <div class="cats" id="cats"></div>
      <div class="subrow">
        <div class="tags" id="tags"></div>
        <div class="sort">
          <button data-sort="rank" class="on">默认排序</button>
          <button data-sort="name">按名称</button>
        </div>
      </div>
    </div>

    <main id="boards"></main>
    <div class="empty" id="empty"><div class="big">🔍</div>没有匹配的结果，换个关键词试试～</div>

    <footer>
      数据由站长手工精选维护，<b>非实时抓取</b>；想加站点改 <code>hub-data.js</code> 即可。<br>
      © ATRI 的小站 · <a href="index.html">返回主页</a>
    </footer>
  </div>

  <button class="totop" id="toTop" title="返回顶部" aria-label="返回顶部">↑</button>

  <script src="hub-data.js"></script>
  <script>
  (function(){
    // ---- 主题（与主站一致：读/写 data-theme + localStorage） ----
    var toggle = document.getElementById("themeToggle");
    if(localStorage.getItem("theme") === "dark"){
      document.documentElement.setAttribute("data-theme","dark");
      toggle.textContent = "☀️";
    }
    toggle.addEventListener("click", function(){
      var dark = document.documentElement.getAttribute("data-theme") === "dark";
      if(dark){ document.documentElement.removeAttribute("data-theme"); toggle.textContent = "🌙"; localStorage.setItem("theme","light"); }
      else { document.documentElement.setAttribute("data-theme","dark"); toggle.textContent = "☀️"; localStorage.setItem("theme","dark"); }
    });

    var DATA = window.HUB_DATA || { updated:"", categories:[] };
    var all = [];
    DATA.categories.forEach(function(c){
      (c.items || []).forEach(function(it, i){
        all.push(Object.assign({ catId:c.id, catName:c.name, catIcon:c.icon, rank:i+1 }, it));
      });
    });

    // 统计
    document.getElementById("statItems").textContent = all.length;
    document.getElementById("statCats").textContent = DATA.categories.length;
    document.getElementById("statUpdated").textContent = DATA.updated || "—";

    // 状态
    var state = { cat:"all", q:"", tag:"", sort:"rank" };

    // 分类标签
    var catsEl = document.getElementById("cats");
    var catAll = mkCat("all", "🌐 全部");
    catsEl.appendChild(catAll);
    DATA.categories.forEach(function(c){ catsEl.appendChild(mkCat(c.id, c.icon + " " + c.name)); });
    function mkCat(id, label){
      var b = document.createElement("button");
      b.className = "cat" + (id === state.cat ? " on" : "");
      b.textContent = label; b.dataset.cat = id;
      b.addEventListener("click", function(){ selectCat(id); });
      return b;
    }
    function selectCat(id){
      state.cat = id; state.tag = "";
      syncCats(); buildTags(); render();
    }
    function syncCats(){
      [].forEach.call(catsEl.children, function(b){ b.classList.toggle("on", b.dataset.cat === state.cat); });
    }

    // 标签云（按当前分类聚合）
    var tagsEl = document.getElementById("tags");
    function buildTags(){
      tagsEl.innerHTML = "";
      var pool = all.filter(function(it){ return state.cat === "all" || it.catId === state.cat; });
      var set = {};
      pool.forEach(function(it){ (it.tags||[]).forEach(function(t){ set[t] = (set[t]||0)+1; }); });
      var arr = Object.keys(set).sort(function(a,b){ return set[b]-set[a]; });
      if(!arr.length) return;
      var allBtn = mkTag("", "全部标签");
      tagsEl.appendChild(allBtn);
      arr.slice(0, 18).forEach(function(t){ tagsEl.appendChild(mkTag(t, t)); });
      syncTags();
    }
    function mkTag(t, label){
      var b = document.createElement("button");
      b.className = "tag"; b.textContent = label; b.dataset.tag = t;
      b.addEventListener("click", function(){ state.tag = (state.tag === t ? "" : t); syncTags(); render(); });
      return b;
    }
    function syncTags(){
      [].forEach.call(tagsEl.children, function(b){ b.classList.toggle("on", b.dataset.tag === state.tag); });
    }

    // 排序
    [].forEach.call(document.querySelectorAll(".sort button"), function(b){
      b.addEventListener("click", function(){
        state.sort = b.dataset.sort;
        [].forEach.call(document.querySelectorAll(".sort button"), function(x){ x.classList.toggle("on", x === b); });
        render();
      });
    });

    // 搜索
    var searchEl = document.getElementById("search");
    searchEl.addEventListener("input", function(){ state.q = searchEl.value.trim().toLowerCase(); render(); });

    // 渲染
    var boardsEl = document.getElementById("boards");
    var emptyEl = document.getElementById("empty");

    function matches(it){
      if(state.cat !== "all" && it.catId !== state.cat) return false;
      if(state.tag && (it.tags||[]).indexOf(state.tag) === -1) return false;
      if(state.q){
        var hay = (it.title + " " + (it.desc||"") + " " + (it.platform||"") + " " + (it.tags||[]).join(" ") + " " + it.catName).toLowerCase();
        if(hay.indexOf(state.q) === -1) return false;
      }
      return true;
    }

    function render(){
      var list = all.filter(matches);
      if(state.sort === "name") list.sort(function(a,b){ return a.title.localeCompare(b.title, "zh"); });
      else list.sort(function(a,b){ return (a.catId===b.catId) ? (a.rank-b.rank) : 0; });

      boardsEl.innerHTML = "";
      if(!list.length){ emptyEl.classList.add("show"); return; }
      emptyEl.classList.remove("show");

      // 按分类分组（全部/标签/搜索时仍按原分类分板块，保持聚合感）
      var groups = {};
      list.forEach(function(it){ (groups[it.catId] = groups[it.catId] || []).push(it); });
      DATA.categories.forEach(function(c){
        var items = groups[c.id];
        if(!items || !items.length) return;
        boardsEl.appendChild(mkSection(c, items));
      });
    }

    function mkSection(c, items){
      var sec = document.createElement("section");
      sec.className = "sec";
      var head = document.createElement("div");
      head.className = "sec-head";
      head.innerHTML = '<span class="ico">'+c.icon+'</span><h2>'+esc(c.name)+'</h2><span class="desc">'+esc(c.desc||"")+'</span><span class="cnt">'+items.length+' 个</span>';
      sec.appendChild(head);
      var ul = document.createElement("ul");
      ul.className = "list";
      items.forEach(function(it){
        var li = document.createElement("li");
        li.className = "item" + (it.rank===1 ? " top" : "");
        var tags = (it.tags||[]).map(function(t){ return '<span class="itag">'+esc(t)+'</span>'; }).join("");
        li.innerHTML =
          '<span class="rank">'+it.rank+'</span>' +
          '<div class="item-body">' +
            '<div class="item-title">'+esc(it.title)+(it.hot?'<span class="hot">🔥 热门</span>':'')+'</div>' +
            '<div class="item-desc">'+esc(it.desc||"")+'</div>' +
            (tags?'<div class="item-tags">'+tags+'</div>':'') +
          '</div>' +
          '<div class="item-meta"><span class="plat">'+esc(it.platform||"")+'</span></div>' +
          '<a class="go" href="'+esc(it.url)+'" target="_blank" rel="noopener" title="访问 '+esc(it.title)+'">↗</a>';
        ul.appendChild(li);
      });
      sec.appendChild(ul);
      return sec;
    }

    function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(m){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[m]; }); }

    // 返回顶部
    var toTop = document.getElementById("toTop");
    window.addEventListener("scroll", function(){ toTop.classList.toggle("show", window.scrollY > 360); }, { passive:true });
    toTop.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });

    // ---- 全网热榜（纯文字标题，参考 open2hub，点击跳对应平台） ----
    function trendUrl(base, q){
      var u = encodeURIComponent(q);
      if(base === "bili")    return "https://search.bilibili.com/all?keyword=" + u;
      if(base === "tieba")   return "https://tieba.baidu.com/f/search/res?qw=" + u;
      if(base === "weibo")   return "https://s.weibo.com/weibo?q=" + u;
      if(base === "zhihu")   return "https://www.baidu.com/s?wd=" + encodeURIComponent(q + " 知乎");
      if(base === "mal")     return "https://myanimelist.net/anime.php?q=" + u;
      if(base === "anilist") return "https://anilist.co/search/anime?query=" + u;
      return "https://www.baidu.com/s?wd=" + u;
    }
    // item 可为字符串，或 { t:"搜索词(英文)", cn:"中文译名" }
    function renderTrends(region, gridId, noteId){
      var list = (DATA.trends || []).filter(function(g){ return g.region === region; });
      var grid = document.getElementById(gridId);
      var note = document.getElementById(noteId);
      if(note) note.textContent = "数据快照于 " + (DATA.updated || "—") + "，非实时更新；标题来自各平台真实热门，点击可跳去对应平台查看。";
      grid.innerHTML = list.map(function(g){
        var rows = (g.items || []).map(function(it, i){
          var title, q;
          if(typeof it === "string"){ title = it; q = it; }
          else { title = it.cn ? (it.t + "（" + it.cn + "）") : it.t; q = it.t; }
          var url = trendUrl(g.base, q);
          return '<li class="trend-item"><span class="trend-no">' + (i+1) + '</span><a href="' + url + '" target="_blank" rel="noopener" title="在' + esc(g.platform) + '查看">'+esc(title)+'</a></li>';
        }).join("");
        return '<div class="trend-col"><h3><span>' + esc(g.emoji || "🔥") + '</span>' + esc(g.platform) + '<span class="ph">' + (g.items||[]).length + ' 条</span></h3><ul class="trend-list">' + rows + '</ul></div>';
      }).join("");
    }
    renderTrends("domestic", "hotGridDomestic", "trendNoteDomestic");
    renderTrends("overseas", "hotGridOverseas", "trendNoteOverseas");

    // 初始化
    buildTags();
    render();
  })();
  </script>
</body>
</html>
